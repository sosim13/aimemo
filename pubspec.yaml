name: aimemo
description: "AI-powered memo app with YouTube URL sharing and automatic categorization"
publish_to: 'none'
version: 1.1.0+2

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  provider: ^6.1.2

  # Local database
  sqflite: ^2.4.1
  path: ^1.9.1

  # Secure storage for API keys
  flutter_secure_storage: ^9.2.4

  # HTTP client
  http: ^1.3.0

  # URL launcher
  url_launcher: ^6.3.1


  # Date formatting
  intl: ^0.20.2

  # UUID generation
  uuid: ^4.5.1

  # File system path for LiteRT model storage
  path_provider: ^2.1.5

  # Flutter Gemma — on-device LLM inference via LiteRT-LM
  # https://pub.dev/packages/flutter_gemma
  flutter_gemma: ^1.1.2
  flutter_gemma_litertlm: ^1.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
