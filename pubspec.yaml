name: aimemo
description: "AI-powered memo app with YouTube URL sharing and automatic categorization"
publish_to: 'none'
version: 1.1.0+2

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  provider: ^6.1.2

  # Local database
  sqflite: ^2.4.1
  path: ^1.9.1

  # Secure storage for settings
  flutter_secure_storage: ^9.2.4

  # HTTP client (for web page fetching, YouTube API, etc.)
  http: ^1.3.0

  # URL launcher
  url_launcher: ^6.3.1


  # Date formatting
  intl: ^0.20.2

  # UUID generation
  uuid: ^4.5.1

  # File system path for LiteRT model storage
  path_provider: ^2.1.5

  # Flutter Gemma — on-device LLM inference via LiteRT-LM
  # https://pub.dev/packages/flutter_gemma
  flutter_gemma: ^1.1.2
  flutter_gemma_litertlm: ^1.0.2

  # Naver Map (for address location display)
  flutter_naver_map: ^1.4.4

  # Supabase (auth + cloud sync)
  supabase_flutter: ^2.8.0

  # Environment variables (.env file)
  flutter_dotenv: ^5.2.1

  # Cached network images (thumbnail sync)
  cached_network_image: ^3.4.1

  # Image processing (resize + webp for thumbnail sync)
  image: ^4.5.3

  # Calendar view (reading calendar)
  table_calendar: ^3.1.3

  # Geolocation (for current location on map)
  geolocator: ^13.0.2

  # Reading Tracker feature
  camera: ^0.11.0+2
  opencv_dart: ^1.4.5
  google_mlkit_text_recognition: ^0.16.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  # 환경변수 파일 (.env) — git에 커밋되지 않음 (.gitignore에 추가됨)
  assets:
    - .env
